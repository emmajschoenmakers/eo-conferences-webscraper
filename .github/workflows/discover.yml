name: Find new conferences
on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of every month
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/discover.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/new-conferences
          title: "New conference candidates"
          commit-message: "Add conference candidates found by monthly search"
          body: "Automatically found by Claude with web search. Check each date and link before merging."
          add-paths: data/conferences.yml
